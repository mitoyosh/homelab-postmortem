title: The Homelab Postmortem
description: >-
  Real, dated postmortems from running a homelab — what broke, how it was
  diagnosed, and the exact fix. Plus the verified scripts that came out of it.
url: "https://homelabpostmortem.com"
baseurl: ""

markdown: kramdown
theme: null
plugins:
  - jekyll-feed
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/

# GitHub Pages builds in UTC. Without this, a post written after midnight JST
# carries tomorrow's date from UTC's point of view, and Jekyll silently drops
# it as a future post — the build succeeds and the page 404s.
timezone: Asia/Tokyo

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - README.md
