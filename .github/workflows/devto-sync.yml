name: Sync new posts to dev.to

on:
  push:
    branches: [main]
    paths:
      - '_posts/**.md'
  # The push trigger only picks up *newly added* posts, so a sync that fails
  # (a too-long title, a transient dev.to error) cannot be retried by editing
  # and pushing again. This lets one file be re-sent by hand.
  workflow_dispatch:
    inputs:
      file:
        description: 'Post path to sync, e.g. _posts/2026-09-07-slug.md'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find newly added posts
        id: find
        run: |
          if [ -n "${{ inputs.file }}" ]; then
            ADDED="${{ inputs.file }}"
          else
            ADDED=$(git diff --diff-filter=A --name-only HEAD^ HEAD -- '_posts/*.md' || true)
          fi
          echo "files<<DEVTO_EOF" >> "$GITHUB_OUTPUT"
          echo "$ADDED" >> "$GITHUB_OUTPUT"
          echo "DEVTO_EOF" >> "$GITHUB_OUTPUT"

      - name: Publish to dev.to
        if: steps.find.outputs.files != ''
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
        run: |
          chmod +x .github/scripts/devto-sync.sh
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            .github/scripts/devto-sync.sh "$file"
          done <<< "${{ steps.find.outputs.files }}"
