name: Sync posts to dev.to

on:
  push:
    branches: [main]
    paths:
      - '_posts/**.md'
  # Kept for re-sending one file by hand: a sync that failed on a transient
  # dev.to error, or a post whose push-triggered run was skipped.
  workflow_dispatch:
    inputs:
      file:
        description: 'Post path to sync, e.g. _posts/2026-09-07-slug.md'
        required: true
        type: string
      update_only:
        description: 'Refuse to create a new article; only update an existing one'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find added or modified posts
        id: find
        run: |
          # 2026-09-09: was --diff-filter=A. Edits are now safe to re-send —
          # devto-sync.sh looks the article up by canonical_url and PUTs when it
          # already exists — so a correction to a published post propagates to
          # dev.to instead of leaving the syndicated copy serving the old text.
          if [ -n "${{ inputs.file }}" ]; then
            ADDED="${{ inputs.file }}"
          else
            ADDED=$(git diff --diff-filter=AM --name-only HEAD^ HEAD -- '_posts/*.md' || true)
          fi
          echo "files<<DEVTO_EOF" >> "$GITHUB_OUTPUT"
          echo "$ADDED" >> "$GITHUB_OUTPUT"
          echo "DEVTO_EOF" >> "$GITHUB_OUTPUT"

      - name: Publish to dev.to
        if: steps.find.outputs.files != ''
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          DEVTO_UPDATE_ONLY: ${{ inputs.update_only && '1' || '0' }}
        run: |
          chmod +x .github/scripts/devto-sync.sh
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            .github/scripts/devto-sync.sh "$file"
          done <<< "${{ steps.find.outputs.files }}"
